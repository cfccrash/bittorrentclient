name: Build Windows installer
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller
      - name: Self-test
        run: python test_local.py
      - name: Build the program folder
        run: python -m PyInstaller --noconfirm --clean --onedir --windowed --icon BitTorrentClient.ico --name BitTorrentClient bittorrentclient.py
      - name: Bundle libmpv (the repository copy if there is one, otherwise download it)
        shell: pwsh
        run: |
          foreach ($n in "libmpv-2.dll","mpv-2.dll") { if (Test-Path $n) { Copy-Item $n dist\BitTorrentClient\ } }
          if (-not (Test-Path dist\BitTorrentClient\libmpv-2.dll) -and -not (Test-Path dist\BitTorrentClient\mpv-2.dll)) {
            python libmpv_get.py dist\BitTorrentClient
          }
      - name: Make sure Inno Setup is available
        shell: pwsh
        run: |
          $found = @("$env:ProgramFiles\Inno Setup 7", "${env:ProgramFiles(x86)}\Inno Setup 6", "$env:ProgramFiles\Inno Setup 6") | Where-Object { Test-Path "$_\ISCC.exe" }
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not $found) {
            choco install innosetup -y --no-progress
          }
      - name: Build the installer
        shell: pwsh
        run: |
          $ver = python -c "from version import VERSION; print(VERSION)"
          $iscc = @("$env:ProgramFiles\Inno Setup 7", "${env:ProgramFiles(x86)}\Inno Setup 6", "$env:ProgramFiles\Inno Setup 6") |
                  ForEach-Object { "$_\ISCC.exe" } | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { $iscc = (Get-Command iscc).Source }
          & $iscc installer.iss "/DMyAppVersion=$ver"
      - name: Zip the portable program folder
        shell: pwsh
        run: Compress-Archive -Path dist\BitTorrentClient\* -DestinationPath BitTorrentClient-portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: BitTorrentClient-windows
          path: |
            installer/*.exe
            BitTorrentClient-portable.zip
      # Version tags (v1.9.21 ...) are published to the PUBLIC releases repository, which the app's updater reads
      # (updater.RELEASES_REPO). This source repository stays private. RELEASES_TOKEN is a fine-grained token with
      # "Contents: read and write" on the releases repository only, stored in this repository's Actions secrets.
      - name: Publish the release for automatic updates
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if (-not $env:GH_TOKEN) { Write-Error "The RELEASES_TOKEN secret is missing (see README: Releases)."; exit 1 }
          $repo = python -c "import updater; print(updater.RELEASES_REPO)"
          $ver = python -c "from version import VERSION; print(VERSION)"
          $tag = "${{ github.ref_name }}"
          if ($tag.TrimStart("v") -ne $ver) { Write-Error "Tag $tag does not match version.py ($ver)."; exit 1 }
          python -c "import re,sys; t=open('README.md',encoding='utf-8').read(); m=re.search(r'^### '+re.escape(sys.argv[1])+r'\s*\n(.*?)(?=^### |\Z)', t, re.S|re.M); open('notes.md','w',encoding='utf-8').write(m.group(1).strip() if m else 'Bit Torrent Client '+sys.argv[1])" $ver
          # also a copy under a fixed name, so .../releases/latest/download/BitTorrentClient-Setup.exe never changes
          # (the app's updater only picks the versioned name: BitTorrentClient-Setup-<version>.exe)
          $setup = (Get-ChildItem installer\BitTorrentClient-Setup-*.exe).FullName
          Copy-Item $setup BitTorrentClient-Setup.exe
          gh release create $tag $setup BitTorrentClient-Setup.exe BitTorrentClient-portable.zip --repo $repo --title "Bit Torrent Client $ver" --notes-file notes.md
